<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fellowship Companion - Rations Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <div class="header">
        <a href="home.html" class="back-button">←</a>
        <h1>
            <a href="home.html" class="title-link">
                The Fellowship Companion
            </a>
        </h1>
    </div>

    <div class="title-divider"></div>

    <h2>Rations Tracker</h2>

    <div class="rations-display">
        <p class="text">Available rations</p>
        <div id="food-count">0</div>
    </div>

    <input id="food-input" type="number" placeholder="Enter amount">


    <div class="button-row">
        <button id="add-food">Add</button>
        <button id="remove-food">Remove</button>
    </div>

    <br></br>

    <div class="chart-box">
        <canvas id="rationChart"></canvas>
    </div>
    
</div>

<script src="rationstracker.js"></script>
</body>
</html>
