<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fellowship Companion</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <div class="top-bar">
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <h1>Fellowship Companion</h1>
    <div class="separator"></div>

    <p class="text">
        Choose your destination and explore possible routes through Middle-earth.
    </p>

    <div class="dropdown">
        <label>Location:</label>
        <select>
            <option>Rivendell</option>
            <option>The Shire</option>
            <option>Gondor</option>
            <option>Rohan</option>
            <option>Mirkwood</option>
            <option>Lothlórien</option>
            <option>Isengard</option>
            <option>Bree</option>
        </select>
    </div>

    <div class="dropdown">
        <label>Destination:</label>
        <select>
            <option>The Shire</option>
            <option>Minas Tirith</option>
            <option>Mordor</option>
            <option>Helm's Deep</option>
            <option>Mount Doom</option>
            <option>Edoras</option>
            <option>Dale</option>
            <option>Lonely Mountain</option>
        </select>
    </div>

    <div class="route-options">
        <p class="label">Route Options</p>

        <div class="card">
            <div class="card-header">
                <div class="left">
                    <span class="icon danger">⚔️</span>
                    <h3>Route A: Fast</h3>
                </div>
                <div class="selector"></div>
            </div>
            <p>Travel Time: Short</p>
            <p>Risk Level: High</p>
            <p>Stops: 1 waypoint</p>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="left">
                    <span class="icon safe">🛡️</span>
                    <h3>Route B: Safe</h3>
                </div>
                <div class="selector"></div>
            </div>
            <p>Travel Time: Longer</p>
            <p>Risk Level: Low</p>
            <p>Stops: 2 waypoints</p>
        </div>
    </div>

    <div class="button">Confirm Decision</div>

</div>

</body>
</html>
