<header>

</header>

<main>
  <section>

  </section>

  <form>
    <label>Location</label>
    <select>...</select>

    <label>Destination</label>
    <select>...</select>

    <section>
      <h2>Route Options</h2>

      <article>
        <h3>Route A: Fast</h3>
        <p>Travel Time: Short</p>
        <p>Risk Level: High</p>
        <p>Stops: 1 waypoint</p>
      </article>

      <article>
        <h3>Route B: Safe</h3>
        <p>Travel Time: Longer</p>
        <p>Risk Level: Low</p>
        <p>Stops: 2 waypoints</p>
      </article>

      <button type="button">Confirm Decision</button>
    </section>
  </form>
</main>
